# Minimal Starship prompt: info line on top, bare prompt char below.
# Only what `format` references renders; modules that ship disabled
# (status, git_metrics, sudo) need an explicit `disabled = false`.

format = """
$hostname$directory$fill$git_branch$git_status$git_metrics$git_state$ruby$nodejs$python$cmd_duration$sudo$jobs$status
$character"""

[fill]
symbol = ' '

[directory]
truncation_length = 0
truncate_to_repo = true

[git_branch]
format = '[$branch]($style) '

[hostname]
format = '[$ssh_symbol$hostname]($style) '

[status]
# Small dim marker; suppress Ctrl-C / kill / term and show a number only for
# codes that have no stock meaning.
disabled = false
symbol = '✗'
style = 'red'
format = '[$symbol$maybe_int]($style)'
recognize_signal_code = true
map_symbol = true
sigint_symbol = ''
signal_symbol = ''
not_executable_symbol = '✗'
not_found_symbol = '✗'

[git_metrics]
disabled = false
added_style = 'bold green'
deleted_style = 'bold red'

[sudo]
disabled = false
symbol = 'ROOT'
style = 'bold yellow'
format = '[$symbol]($style) '

[cmd_duration]
min_time = 2000
show_milliseconds = false
format = '[$duration]($style) '
style = 'dimmed'

[ruby]
format = '[$symbol$version]($style) '

[nodejs]
format = '[$symbol$version]($style) '

[python]
format = '[$symbol$version]($style) '
