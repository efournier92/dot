gui:
  showFileTree: false
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --side-by-side
customCommands:
  - key: "e"
    context: "files"
    description: "Open file in vertical fugitive diff (Gvdiffsplit)"
    command: nvim --server "$NVIM" --remote-expr "execute(['tabedit '.fnameescape('{{.SelectedFile.Name}}'), 'leftabove Gvdiffsplit @', 'windo normal! zR'])"
    output: none
